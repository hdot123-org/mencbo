# MenCbo Desktop PostHog Event Registry
# Single source of truth for all analytics events
# Standard: posthog-desktop-monitoring-standard-v1.1

schema_version: "1.0"

posthog:
  project_id: 597439
  host: us.posthog.com
  project_name: MenCbo Desktop

# Code generators that consume this registry
generators:
  typescript: apps/desktop/client/src/lib/analytics-events.gen.ts
  rust: apps/desktop/client/src-tauri/src/analytics_events_gen.rs

# Baseline properties (automatically attached to all events)
# These are registered at analytics initialization and persist across all captures
baseline_properties:
  # fix-sentinel-degraded-flag: marks events from degraded installs (install_id IO failure)
  # When true, JS skips bootstrap to avoid collapsing all degraded installs into fake distinct_id
  identity_degraded:
    type: boolean
    layer: webview
    description: "True when install_id IO failed at startup, causing identity bootstrap to be skipped"

# Event definitions
# layer: rust | webview | both
# status: active | deprecated
events:
  # === Lifecycle Events ===
  rust_launch:
    layer: rust
    status: active
    props:
      version: string
    description: Process startup

  rust_exit:
    layer: rust
    status: active
    props:
      reason: string  # normal | dirty | abnormal
      via: string     # command | tray_menu | system (dirty path does not emit via)
      uptime_s: number
      prev_session_id: string  # dirty path only: previous session's session_id
      pending_flushed: boolean  # normal path only: result of flush_sync before exit
    description: "Process exit event (architecture decision 4: rust authoritative exit event)"

  rust_heartbeat:
    layer: rust
    status: active
    props:
      seq: number  # Monotonic counter within session, starts at 0
    description: 5-minute heartbeat from Rust layer (seq increments each emission)

  js_launch:
    layer: webview
    status: active
    props: {}
    description: Webview initialization

  js_heartbeat:
    layer: webview
    status: active
    props:
      uptime_sec: number
      seq: number  # Monotonic counter within visible window, resets on context rebuild
    description: >
      Visibility-period heartbeat from webview layer. seq is monotonic only within
      each visible window (panel shown); across hidden windows seq resets to 0
      (JS context rebuilt by macOS App Nap suspension of WKWebView). Missing heartbeats
      during hidden periods are normal — not event loss. Gap detection applies only
      within visible windows (seq gap ≥10 min without filling = suspected loss).
      Contrast with rust_heartbeat which is process-level and runs regardless of visibility.

  # === Panel Events ===
  panel_open:
    layer: rust
    status: active
    props:
      via: string  # tray | reopen
      panel_id: string  # Unique panel instance ID (session_id)
    description: Panel shown (Rust single source since #52; via:reopen for single-instance second launch)

  panel_close:
    layer: rust
    status: active
    props:
      via: string  # tray | blur | close
      panel_id: string  # Unique panel instance ID (session_id)
    description: Panel hidden (Rust single source since #52)

  # === State Management ===
  state_load:
    layer: webview
    status: active
    props:
      tasks: number
      duration_ms: number
    description: Initial state loaded successfully

  diag_state_load_failed:
    layer: webview
    status: active
    props:
      reason: string
    description: Initial state load failed

  state_sync:
    layer: both
    status: active
    props:
      tasks: number
      mock: boolean
    description: State file changed and synced

  # === Task Execution ===
  task_run:
    layer: rust
    status: active
    props:
      task: string
    description: Task execution invoked

  diag_task_spawn_failed:
    layer: rust
    status: active
    props:
      task: string
      error: string
    description: Failed to spawn task process

  # === Logging ===
  logs_open:
    layer: rust
    status: active
    props: {}
    description: Log directory opened successfully

  diag_logs_open_failed:
    layer: rust
    status: active
    props:
      stage: string  # mkdir | finder
      error: string
    description: Failed to open log directory

  # === Auto-Update ===
  app_update_check:
    layer: rust
    status: active
    props:
      source: string  # auto | manual | tray
    description: Update check initiated

  app_update_checked:
    layer: rust
    status: active
    props:
      result: string  # uptodate
      source: string
    description: Update check completed (no update available)

  app_update_failed:
    layer: rust
    status: active
    props:
      stage: string  # builder | check | install
      detail: string
      source: string
    description: Update process failed

  app_update_installed:
    layer: rust
    status: active
    props:
      to: string
      source: string
    description: Update installed successfully

  # === Error Events ===
  js_error:
    layer: webview
    status: active
    props:
      message: string
    description: Frontend error caught

  js_unhandled_rejection:
    layer: webview
    status: active
    props:
      reason: string
    description: Unhandled promise rejection

  diag_identity_failed:
    layer: webview
    status: active
    props:
      reason: string
    description: Identity bootstrap failed (invoke or init failure)

  # === Diagnostic Events (M4 Watchdog) ===
  diag_webview_unresponsive:
    layer: rust
    status: active
    props:
      missed_js_beats: number
      threshold_s: number
      error_code: string
    description: Webview frozen - JS heartbeat stopped responding (visibility-aware, only during visible period)

  diag_webview_recovered:
    layer: rust
    status: active
    props:
      freeze_duration_ms: number
      error_code: string
    description: Webview recovered from frozen state

  diag_native_main_unresponsive:
    layer: rust
    status: active
    props:
      stalled_ms: number
      error_code: string
    description: Native main thread blocked (run_on_main_thread timeout)

  diag_ipc_timeout:
    layer: webview
    status: active
    props:
      error_code: string  # E_IPC_TIMEOUT
      timeout_ms: number
      command: string
    description: JS invoke() exceeded timeout threshold (VAL-DIAG-005)

  diag_rust_panic:
    layer: rust
    status: active
    props:
      message: string  # Truncated to ≤300 chars
      backtrace: string  # Backtrace summary
      error_code: string  # E_RUST_PANIC
    description: >
      Rust panic detected — sent synchronously from panic hook via blocking reqwest
      (bypasses batch queue, works under panic=abort). Process aborts after send (VAL-DIAG-006).

  # === Deprecated Events (old names) ===
  # replaced_by is a YAML array (machine-readable) for taxonomy-drift-scan consumption
  quit:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [rust_exit]
    description: Renamed to rust_exit

  tray_menu:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [rust_exit]
    description: Removed (redundant with rust_exit + app_update_check)

  tray_click:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [panel_open, panel_close]
    description: Split into panel_open/panel_close with via:tray

  run_task:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [task_run]
    description: Renamed to task_run ([module]_[action] format)

  run_task_spawn_failed:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [diag_task_spawn_failed]
    description: Renamed to diag_task_spawn_failed (diag_ prefix)

  open_logs:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [logs_open]
    description: Renamed to logs_open ([module]_[action] format)

  open_logs_failed:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [diag_logs_open_failed]
    description: Renamed to diag_logs_open_failed (diag_ prefix)

  updater_check:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [app_update_check]
    description: Renamed to app_update_check

  updater_error:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [app_update_failed]
    description: Renamed to app_update_failed

  updater_uptodate:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [app_update_checked]
    description: Renamed to app_update_checked with result:uptodate

  updater_installed:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [app_update_installed]
    description: Renamed to app_update_installed

  state_changed:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [state_sync]
    description: Renamed to state_sync

  js_state_loaded:
    layer: webview
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [state_load]
    description: Renamed to state_load ([module]_[action] format)

  js_state_updated:
    layer: webview
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [state_sync]
    description: Renamed to state_sync (aligns with Rust side)

  state_load_failed:
    layer: webview
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [diag_state_load_failed]
    description: Renamed to diag_state_load_failed (diag_ prefix)

  panel_blur_hide:
    layer: rust
    status: deprecated
    deprecated_since: "2026-09-07"
    replaced_by: [panel_close]
    description: Merged into panel_close with via:blur
