[project]
name = "mencbo"
version = "0.1.0"
description = "MenCbo desktop scheduler daemon: git-scoped unified task scheduling host"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mencbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
