name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/mencbo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  build-macos:
    name: Build macOS DMG
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/client/src-tauri -> target

      - name: Check tag matches tauri.conf.json version
        working-directory: apps/desktop/client/src-tauri
        run: |
          CONF_VERSION="v$(node -p "require('./tauri.conf.json').version")"
          if [ "${CONF_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${CONF_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG
        working-directory: apps/desktop/client
        run: pnpm tauri build

      - name: Re-sign app bundle
        # tauri-bundler skips signing when no identity is configured; the
        # Mach-O carries only the linker's adhoc signature, which does not
        # cover the bundled Resources (icon.icns) — Gatekeeper then treats
        # the downloaded app as damaged. Re-sign the whole bundle adhoc so
        # the signature is self-consistent.
        run: |
          APP=apps/desktop/client/src-tauri/target/release/bundle/macos/MenCbo.app
          codesign --force --sign - --deep "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Rebuild DMG from re-signed app
        # tauri's dmg bundles the pre-fix signature; repack it ourselves so
        # the shipped DMG contains the re-signed bundle.
        working-directory: apps/desktop/client/src-tauri/target/release/bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          STAGE=$(mktemp -d)
          cp -R macos/MenCbo.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          rm -f dmg/*.dmg
          hdiutil create -volname MenCbo \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "dmg/MenCbo_${VERSION#v}_aarch64.dmg"
          ls -lh dmg/

      - name: Build and sign updater archive
        # Updater packages must embed the RE-SIGNED app (tauri's own artifact
        # would carry the broken pre-fix signature), so repack from the fixed
        # bundle, minisign it, and emit latest.json for the updater endpoint.
        working-directory: apps/desktop/client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ github.ref_name }}
        run: |
          B=src-tauri/target/release/bundle
          rm -f "$B/macos/MenCbo.app.tar.gz" "$B/macos/MenCbo.app.tar.gz.sig"
          tar -czf "$B/macos/MenCbo.app.tar.gz" -C "$B/macos" MenCbo.app
          pnpm tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$B/macos/MenCbo.app.tar.gz"
          SIG=$(cat "$B/macos/MenCbo.app.tar.gz.sig")
          jq -n --arg v "${VERSION#v}" --arg sig "$SIG" \
            --arg url "https://github.com/hdot123-org/mencbo/releases/download/${VERSION}/MenCbo.app.tar.gz" \
            '{version: $v, pub_date: (now | todate),
              platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > "$B/latest.json"
          cat "$B/latest.json"

      - name: Stage release artifacts (flat)
        # upload-artifact keys off the least-common-ancestor of the given
        # paths; multi-dir paths therefore keep their directory layout in the
        # artifact and gh release upload then chokes on directories. Copy
        # everything into one flat staging dir instead.
        run: |
          B=apps/desktop/client/src-tauri/target/release/bundle
          STAGE=$(mktemp -d)
          cp "$B"/dmg/*.dmg "$STAGE/"
          cp "$B"/macos/MenCbo.app.tar.gz "$B"/macos/MenCbo.app.tar.gz.sig "$STAGE/"
          cp "$B"/latest.json "$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -lh "$STAGE/"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mencbo-macos-dmg
          path: ${{ env.STAGE }}/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [verify, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mencbo-macos-dmg
          path: dist-dmg
          # artifact preserves the multi-dir upload layout; flatten so that
          # dist-dmg/* globs only files (gh release upload rejects dirs)
          merge-multiple: true

      - name: Create or update release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist-dmg/
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, updating"
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --latest
            gh release upload "${GITHUB_REF_NAME}" dist-dmg/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes dist-dmg/*
          fi

  npm-publish:
    name: Publish to npm
    needs: verify
    # Skips until NPM_TOKEN secret is configured on the repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/mencbo
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip notice
        if: env.NPM_TOKEN == ''
        working-directory: .
        run: echo "::notice::NPM_TOKEN secret not configured — npm publish skipped"

      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''

      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: env.NPM_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Build
        if: env.NPM_TOKEN != ''
        run: pnpm run build

      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
