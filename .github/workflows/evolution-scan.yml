# Evolution Scanner thin caller（消费仓，对齐 hdot123-org/memory 在产版本）
# 命名契约（NEVER break）：文件名 evolution-scan.yml 与 name: Evolution Scan
# ——heartbeat 引擎按 SCANNER_WORKFLOW = "evolution-scan.yml" 解析扫描器存活。
# INFRA-578：cron 分钟位避开 :00/:30 高峰 load-shed 窗口。

name: Evolution Scan

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

concurrency:
  group: evolution-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    # INFRA-651: reusable 引用钉 tag，与引擎版本对齐，升级走 pin bump PR
    uses: hdot123-org/infra-core/.github/workflows/evolution-scan.yml@v0.15.0
    permissions:
      contents: read
      issues: write
    secrets:
      # snake_case 单形态（M5 R1(3) 终态）
      dispatch_token: ${{ secrets.DISPATCH_TOKEN }}
      linear_api_key: ${{ secrets.LINEAR_API_KEY }}
