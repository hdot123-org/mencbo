name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mencbo
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Analytics scanner tests
        working-directory: .
        run: node --test apps/desktop/analytics/*.test.mjs

  daemon:
    name: Test (Daemon)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/daemon
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/desktop/daemon/uv.lock

      - name: Sync environment
        run: uv sync --frozen

      - name: Test
        run: uv run pytest
